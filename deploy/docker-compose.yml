# Run the loop on any container host (Lightsail / EC2 / NAS / Pi) — or locally to test
# first. Build context is the repo root so the image can copy the code. Full walkthrough:
# deploy/EC2-SETUP.md. From the deploy/ directory:
#   cp ~/.config/rclone/rclone.conf ./rclone.conf      # `rclone config` -> a 'gdrive' remote
#   cp loop.env.example loop.env && nano loop.env      # CLAUDE_CODE_OAUTH_TOKEN, DOCS_REPO
#   docker compose up --build -d
services:
  supernote-sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ./loop.env
    cap_add: ["SYS_ADMIN"]                 # FUSE mount for rclone
    devices: ["/dev/fuse"]
    security_opt: ["apparmor:unconfined"]
    volumes:
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
      - sync-state:/state                  # read-once ledger + digest state (survive restarts)
      - sync-work:/work                    # the docs repo (revertible edits live here)
    restart: unless-stopped

volumes:
  sync-state:
  sync-work:
