# Run the loop on any container host (Lightsail / EC2 / NAS / Pi) — or locally to test
# first. Build context is the repo root so the image can copy the code. Full walkthrough:
# deploy/EC2-SETUP.md. From the deploy/ directory:
#   cp ~/.config/rclone/rclone.conf ./rclone.conf      # `rclone config` -> a 'gdrive' remote
#   cp loop.env.example loop.env && nano loop.env      # CLAUDE_CODE_OAUTH_TOKEN, DOCS_REPO
#   docker compose up --build -d
services:
  supernote-sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ./loop.env
    # No FUSE mount (rclone copy uses the Drive API), so NO privileges are needed: drop every
    # capability and forbid privilege escalation. Much safer if the host runs other things.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./rclone.conf:/seed/rclone.conf:ro # immutable seed; entrypoint copies it to a writable
      - rclone-config:/root/.config/rclone # …location so rclone can persist refreshed OAuth tokens
      - sync-state:/state                  # read-once ledger + digest state (survive restarts)
      - sync-work:/work                    # the docs repo (revertible edits live here)
      - sync-drive:/drive                  # local working copy of the Supernote Drive folder
    restart: unless-stopped

volumes:
  rclone-config:
  sync-state:
  sync-work:
  sync-drive:
