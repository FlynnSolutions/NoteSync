# NoteSync — project + tooling config.
#
# Install (editable, into a dedicated venv — the supported path):
#   python3 -m venv .venv && . .venv/bin/activate
#   pip install -e .            # deps + modules + the `notesync` command
#
# Lint (the project's code standard):
#   ruff check .
#   ruff format --diff          # advisory only — we keep compact data literals

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "notesync"
version = "0.1.0"
description = "Hand-annotate Markdown notes on a Supernote e-ink tablet; Claude reads the ink from the .mark layer and 3-way-merges edits back into source."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Flynn Solutions LLC" }]
keywords = ["supernote", "e-ink", "markdown", "claude", "handwriting", "note-taking", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "anthropic>=0.104",   # read_ink.py — reads handwriting via Claude vision (api backend)
    "fpdf2>=2.8",         # render.py / export.py — markdown -> PDF
    "Pillow>=10",         # marklayer.py — composite ink over page images
    "supernotelib>=0.7",  # provides the `supernote-tool` CLI (.note/.mark -> PNG)
]

[project.urls]
Homepage = "https://github.com/FlynnSolutions/NoteSync"
Repository = "https://github.com/FlynnSolutions/NoteSync"

[project.scripts]
notesync = "notesync.cli:main"

# src/ layout: the package is `notesync` (namespaced imports, no top-level pollution). Runtime
# state (base/, device/, manifest.json, ledger, ...) lives in the user data dir, never the package
# — see config.data_dir(). Fonts ship as package data.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notesync = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "base", "device", "snapshots", "checkin_pages", "out", "merge_out"]

[tool.ruff.lint]
# pyflakes + pycodestyle + isort + pyupgrade + bugbear + comprehensions + simplify.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
